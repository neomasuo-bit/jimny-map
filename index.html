<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>霧が晴れる</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #1a1a1a; color: #eee; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  #header {
    background: #111;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  #header h1 { font-size: 15px; font-weight: 500; flex: 1; }
  #stats { display: flex; gap: 14px; font-size: 12px; color: #aaa; }
  #stats span b { color: #E8852A; font-weight: 600; }

  #map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* 霧キャンバス */
  #fog-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 400;
    display: none;
  }
  #fog-canvas.show { display: block; }

  /* 地図切り替え */
  #layer-switcher {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    display: flex;
    gap: 4px;
    touch-action: none;
  }
  .layer-btn {
    background: #111e;
    border: 1px solid #555;
    color: #ccc;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .layer-btn.active { background: #E8852A; border-color: #E8852A; color: #fff; font-weight: 600; }

  /* GPS メインボタン */
  #gps-btn {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid #E8852A;
    background: #111;
    color: #E8852A;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    touch-action: manipulation;
  }
  #gps-btn.recording {
    background: #E8852A;
    color: #fff;
    border-color: #fff;
    animation: ring 2s infinite;
  }
  @keyframes ring {
    0%,100% { box-shadow: 0 0 0 0 rgba(232,133,42,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(232,133,42,0); }
  }
  #gps-timer { font-size: 13px; font-weight: 700; display: none; }

  /* 記録中バッジ */
  #live-badge {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: #E8852Aee;
    color: #fff;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    gap: 8px;
    align-items: center;
    white-space: nowrap;
  }
  #live-badge.show { display: flex; }
  #live-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* サブボタン */
  #sub-btns {
    position: absolute;
    bottom: 32px;
    right: 16px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    touch-action: none;
  }
  #sub-left {
    position: absolute;
    bottom: 32px;
    left: 16px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    touch-action: none;
  }
  .sub-btn {
    background: #111e;
    border: 1px solid #444;
    color: #ccc;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
  }
  .sub-btn:hover { border-color: #E8852A; color: #E8852A; }

  /* 動画パネル */
  #video-panel {
    position: absolute;
    top: 8px;
    right: 8px;
    width: min(300px, calc(100vw - 16px));
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    z-index: 1000;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #video-panel.open { display: flex; }
  #vp-header {
    padding: 8px 12px;
    font-size: 13px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #vp-header button { background: none; border: none; color: #aaa; cursor: pointer; font-size: 18px; }
  #video-embed { width: 100%; aspect-ratio: 16/9; background: #000; border: none; }
  #video-embed.vertical { aspect-ratio: 9/16; max-height: 50vh; }

  /* 共通モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 2000;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 16px 16px 0 0;
    padding: 20px 20px 36px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h3 { font-size: 15px; font-weight: 500; }
  .modal-box input, .modal-box select, .modal-box textarea {
    background: #111;
    border: 1px solid #555;
    color: #eee;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  .modal-box textarea { height: 72px; resize: none; }
  .modal-box label { font-size: 12px; color: #aaa; margin-bottom: 4px; display: block; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 10px; border-radius: 8px; font-size: 14px;
    cursor: pointer; border: 1px solid #555; background: transparent; color: #eee;
  }
  .modal-btns button.primary { background: #E8852A; border-color: #E8852A; color: #fff; font-weight: 600; }

  /* ピンカテゴリー選択 */
  .pin-categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .pin-cat {
    background: #111;
    border: 2px solid #444;
    border-radius: 10px;
    padding: 10px 4px;
    cursor: pointer;
    text-align: center;
    font-size: 10px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .pin-cat .cat-icon { font-size: 22px; line-height: 1; }
  .pin-cat.selected { border-color: #E8852A; color: #E8852A; background: #E8852A18; }

  /* 写真プレビュー */
  #photo-preview {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    display: none;
  }
  #photo-preview.show { display: block; }
  #photo-drop {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
  }
  #photo-drop:hover { border-color: #E8852A; color: #E8852A; }

  /* ピン詳細パネル */
  #pin-detail {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(320px, calc(100vw - 32px));
    background: #111;
    border: 1px solid #444;
    border-radius: 12px;
    z-index: 1000;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #pin-detail.open { display: flex; }
  #pd-header {
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
  }
  #pd-title { font-size: 14px; font-weight: 500; }
  #pd-close { background: none; border: none; color: #aaa; cursor: pointer; font-size: 18px; }
  #pd-photo { width: 100%; max-height: 180px; object-fit: cover; display: none; }
  #pd-photo.show { display: block; }
  #pd-body { padding: 10px 14px; font-size: 13px; color: #aaa; line-height: 1.6; }
  #pd-video-btn {
    margin: 8px 14px 14px;
    padding: 8px;
    background: #D84040;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: none;
  }
  #pd-video-btn.show { display: block; }

  /* 難易度選択モーダル */
  .difficulty-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .diff-btn {
    padding: 14px 10px;
    border-radius: 10px;
    border: 2px solid #444;
    background: #111;
    color: #eee;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    line-height: 1.6;
  }
  .diff-btn:hover { border-color: currentColor; }
  .diff-btn b { display: block; font-size: 15px; margin-bottom: 2px; }

  /* 現在地ボタン */
  #locate-btn {
    position: absolute;
    top: 110px;
    right: 12px;
    z-index: 1000;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #111e;
    border: 1px solid #555;
    color: #ccc;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #locate-btn:hover { border-color: #4A9EFF; color: #4A9EFF; }
  #locate-btn.active { border-color: #4A9EFF; color: #4A9EFF; }

  /* ヘディングアップ切替ボタン */
  #heading-toggle-btn {
    position: absolute;
    top: 158px;
    right: 12px;
    z-index: 1000;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #111e;
    border: 1px solid #555;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #heading-toggle-btn:hover { border-color: #4A9EFF; color: #4A9EFF; }
  #heading-toggle-btn.active { border-color: #4A9EFF; color: #4A9EFF; background: #4A9EFF33; }

  /* 凡例 */
  #legend {
    position: absolute;
    bottom: 120px;
    left: 16px;
    z-index: 1000;
    background: #111d;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: #ccc;
    line-height: 2;
    display: none;
  }
  #legend.show { display: block; }
  .leg-row { display: flex; align-items: center; gap: 6px; }
  .leg-line { width: 20px; height: 4px; border-radius: 2px; }

  /* 走行履歴パネル */
  #history-panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #111;
    z-index: 1500;
    display: none;
    flex-direction: column;
  }
  #history-panel.open { display: flex; }
  #history-header {
    padding: 12px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #history-header h2 { font-size: 15px; font-weight: 500; flex: 1; }
  #history-header button { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
  #history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .history-item:active { background: #222; }
  .history-diff { width: 6px; height: 48px; border-radius: 3px; flex-shrink: 0; }
  .history-info { flex: 1; }
  .history-date { font-size: 12px; color: #aaa; margin-bottom: 3px; }
  .history-km { font-size: 18px; font-weight: 500; color: #eee; }
  .history-diff-label { font-size: 11px; color: #888; margin-top: 2px; }
  .history-actions { display: flex; flex-direction: column; gap: 6px; }
  .history-btn {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid #444;
    background: transparent;
    color: #ccc;
    white-space: nowrap;
  }
  .history-btn.danger { border-color: #C84040; color: #C84040; }
  .history-empty { text-align: center; color: #555; padding: 40px; font-size: 14px; }

  .leaflet-container { background: #2d3d1f; }
</style>
</head>
<body>

<div id="header">
  <h1>🚙 霧が晴れる</h1>
  <div id="stats">
    <span>走行 <b id="stat-km">0</b> km</span>
    <span>ピン <b id="stat-pins">0</b></span>
  </div>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <canvas id="fog-canvas"></canvas>

  <!-- 地図切り替え -->
  <div id="layer-switcher">
    <button class="layer-btn active" onclick="switchLayer('standard',this)">地図</button>
    <button class="layer-btn" onclick="switchLayer('topo',this)">地形</button>
    <button class="layer-btn" onclick="switchLayer('satellite',this)">衛星</button>
  </div>

  <!-- 走行履歴パネル -->
  <div id="history-panel">
    <div id="history-header">
      <h2>📋 走行履歴</h2>
      <button onclick="document.getElementById('history-panel').classList.remove('open')">✕</button>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- 記録中バッジ -->
  <div id="live-badge">
    <div id="live-dot"></div>
    <span>記録中 <b id="live-km">0.0</b> km</span>
  </div>

  <!-- GPS メインボタン -->
  <button id="gps-btn" onclick="toggleGPS()">
    <span id="gps-icon">📍</span>
    <span id="gps-timer"></span>
    <span id="gps-label">記録開始</span>
  </button>

  <!-- 左サブ -->
  <div id="sub-left">
    <!-- GPXインポート機能を一時非表示、復活させる場合はここのコメントアウトを外す -->
    <!-- <button class="sub-btn" onclick="document.getElementById('gpx-modal').classList.add('open')">📂 GPX</button> -->
    <button class="sub-btn" onclick="clearAll()">🗑 消去</button>
  </div>

  <!-- 右サブ -->
  <div id="sub-btns">
    <button class="sub-btn" id="fog-toggle-btn" onclick="toggleFogMode()">🌫 霧モード</button>
    <button class="sub-btn" onclick="openHistory()">📋 履歴</button>
    <button class="sub-btn" onclick="startPinMode()">📌 ピン追加</button>
    <button class="sub-btn" onclick="toggleLegend()">🗺 凡例</button>
  </div>

  <!-- 現在地ボタン -->
  <button id="locate-btn" onclick="goToCurrentLocation()" title="現在地へ">⊕</button>

  <!-- ヘディングアップ切替 -->
  <button id="heading-toggle-btn" onclick="toggleHeadingUp()" title="ヘディングアップ切替">
    <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
      <polygon points="12,2 15.5,12 12,10 8.5,12" fill="#D84040"/>
      <polygon points="12,22 15.5,12 12,14 8.5,12" fill="#fff"/>
    </svg>
  </button>

  <!-- [DEBUG] webkitCompassHeading調査用の一時表示。確認後に削除すること -->
  <div id="heading-debug" style="display:none; position:absolute; top:200px; right:12px; z-index:1000; background:rgba(0,0,0,0.8); color:#0f0; font-family:monospace; font-size:11px; line-height:1.5; padding:6px 8px; border-radius:6px; white-space:pre; max-width:240px; pointer-events:none;"></div>

  <!-- 凡例 -->
  <div id="legend">
    <div class="leg-row"><div class="leg-line" style="background:#4CAF50"></div>フラット（普通車OK）</div>
    <div class="leg-row"><div class="leg-line" style="background:#FFC107"></div>中級（SUV推奨）</div>
    <div class="leg-row"><div class="leg-line" style="background:#E8852A"></div>上級（4WD必須）</div>
    <div class="leg-row"><div class="leg-line" style="background:#D84040"></div>激険（上級者向け）</div>
    <div class="leg-row"><div class="leg-line" style="background:#888"></div>未分類</div>
  </div>

  <!-- 動画パネル -->
  <div id="video-panel">
    <div id="vp-header">
      <span id="vp-title">動画</span>
      <button onclick="closeVideoPanel()">✕</button>
    </div>
    <iframe id="video-embed" allowfullscreen></iframe>
  </div>

  <!-- ピン詳細 -->
  <div id="pin-detail">
    <div id="pd-header">
      <span id="pd-cat-icon"></span>&nbsp;<span id="pd-title"></span>
      <button id="pd-close" onclick="closePinDetail()">✕</button>
    </div>
    <img id="pd-photo" alt="現地写真">
    <div id="pd-body"></div>
  <button id="pd-video-btn" onclick="playPinVideo()">▶ 動画を再生</button>
  <div style="display:flex;gap:8px;padding:0 14px 14px;">
    <button onclick="editCurrentPin()" style="flex:1;padding:8px;border-radius:8px;border:1px solid #555;background:transparent;color:#ccc;font-size:13px;cursor:pointer;">✏️ 編集</button>
    <button onclick="deleteCurrentPin()" style="flex:1;padding:8px;border-radius:8px;border:1px solid #C84040;background:transparent;color:#C84040;font-size:13px;cursor:pointer;">🗑 削除</button>
  </div>
</div>
</div>

<!-- ピン追加モーダル -->
<div id="pin-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>📌 ピンを追加</h3>

    <div>
      <label>カテゴリー</label>
      <div class="pin-categories">
        <div class="pin-cat selected" data-cat="road_closed" onclick="selectCat(this)">
          <span class="cat-icon">🚧</span>通行止め
        </div>
        <div class="pin-cat" data-cat="winter_closed" onclick="selectCat(this)">
          <span class="cat-icon">❄️</span>冬季閉鎖
        </div>
        <div class="pin-cat" data-cat="collapse" onclick="selectCat(this)">
          <span class="cat-icon">🪨</span>崩落
        </div>
        <div class="pin-cat" data-cat="barricade" onclick="selectCat(this)">
          <span class="cat-icon">⛔</span>バリケード
        </div>
        <div class="pin-cat" data-cat="caution" onclick="selectCat(this)">
          <span class="cat-icon">⚠️</span>路面注意
        </div>
        <div class="pin-cat" data-cat="no_signal" onclick="selectCat(this)">
          <span class="cat-icon">📵</span>圏外
        </div>
        <div class="pin-cat" data-cat="bear" onclick="selectCat(this)">
          <span class="cat-icon">🐻</span>熊出没
        </div>
        <div class="pin-cat" data-cat="video" onclick="selectCat(this)">
          <span class="cat-icon">📹</span>動画
        </div>
      </div>
    </div>

    <div>
      <label>場所・メモ</label>
      <input type="text" id="pin-name" placeholder="例：○○林道入口付近">
    </div>

    <div>
      <label>詳細メモ（任意）</label>
      <textarea id="pin-note" placeholder="状況の詳細など..."></textarea>
    </div>

    <!-- 動画URLフィールド（動画カテゴリーのみ表示） -->
    <div id="pin-url-wrap" style="display:none">
      <label>動画URL</label>
      <input type="url" id="pin-url" placeholder="https://...">
      <label style="margin-top:8px">動画の向き</label>
      <select id="pin-orient">
        <option value="h">横動画（YouTube通常）</option>
        <option value="v">縦動画（リール・ショート）</option>
      </select>
    </div>

    <!-- 写真 -->
    <div id="pin-photo-wrap">
      <label>写真（任意）</label>
      <img id="photo-preview" alt="プレビュー">
      <div id="photo-drop" onclick="document.getElementById('photo-input').click()">
        📷 タップして写真を追加
      </div>
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewPhoto(this)">
    </div>

    <div class="modal-btns">
      <button onclick="cancelPin()">キャンセル</button>
      <button class="primary" onclick="confirmPin()">追加</button>
    </div>
  </div>
</div>

<!-- 難易度選択モーダル -->
<div id="diff-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>🏔 難易度を設定</h3>
    <div class="difficulty-grid">
      <button class="diff-btn" style="color:#4CAF50" onclick="setDifficulty('easy')">
        <b>🟢 フラット</b>砂利・整備済み<br>普通車でも可
      </button>
      <button class="diff-btn" style="color:#FFC107" onclick="setDifficulty('medium')">
        <b>🟡 中級</b>ダート・轍あり<br>SUV推奨
      </button>
      <button class="diff-btn" style="color:#E8852A" onclick="setDifficulty('hard')">
        <b>🟠 上級</b>岩・ガレ場<br>4WD必須
      </button>
      <button class="diff-btn" style="color:#D84040" onclick="setDifficulty('extreme')">
        <b>🔴 激険</b>泥・急斜面<br>上級者のみ
      </button>
    </div>
    <button class="diff-btn" style="color:#888;margin-top:4px" onclick="setDifficulty('unset')">
      ⬜ 未分類に戻す
    </button>

<script>
const map = L.map('map', {

// keepBuffer: 4（デフォルト2から増量）でパン時に周辺タイルをより広く保持し、再取得を減らす。
// updateWhenZooming: false でズーム中の中間ズームレベルでのタイル取得を止め、

const layers = {

  }),

  }),

    attribution: '© Esri', maxZoom: 18, keepBuffer: 4, updateWhenZooming: false

}

// 難易度定義
const DIFF = {
  easy:    { color: '#4CAF50', label: '🟢 フラット' },
  medium:  { color: '#FFC107', label: '🟡 中級' },
  hard:    { color: '#E8852A', label: '🟠 上級' },
  extreme: { color: '#D84040', label: '🔴 激険' },

};
let selectedTrackIndex = null;

// カテゴリー定義
const CAT = {
  road_closed:  { icon: '🚧', label: '通行止め',   color: '#E8852A' },
  winter_closed:{ icon: '❄️', label: '冬季閉鎖',   color: '#4A9EFF' },
  collapse:     { icon: '🪨', label: '崩落',        color: '#8B5E3C' },
  barricade:    { icon: '⛔', label: 'バリケード',  color: '#CC3333' },
  caution:      { icon: '⚠️', label: '路面注意',    color: '#D4AA00' },
  no_signal:    { icon: '📵', label: '圏外',        color: '#666' },
  bear:         { icon: '🐻', label: '熊出没',      color: '#6B3A2A' },
  video:        { icon: '📹', label: '動画',        color: '#D84040' },
};

// データ
let tracks = [];
let pins = [];
let totalKm = 0;
let selectedPhotoData = null;
let currentPinData = null;

// GPS
let gpsWatcher = null;
let gpsSegments = [[]];   // 記録中の軌跡（セグメント配列。復帰時のギャップで分割される）
let gpsPolylines = [];    // gpsSegments に対応する L.Polyline 配列
let gpsStartTime = null;
let timerInterval = null;
let currentMarker = null;
let currentSessionId = null;
let pendingGapCheck = false; // 復帰直後の最初のフィックスでギャップ判定を行うフラグ

// 現在地の補間アニメーション
let displayedLatLng = null;
let animRAF = null;

// Wake Lock
let wakeLock = null;

// ---- GPS ----
function goToCurrentLocation() {
  const btn = document.getElementById('locate-btn');
  btn.classList.add('active');
  if (!navigator.geolocation) { alert('GPSに対応していません'); return; }

}

// ---- 霧モード ----
let fogMode = false;
const fogCanvas = document.getElementById('fog-canvas');
const fogCtx = fogCanvas.getContext('2d');

// 霧の晴れ半径（実世界メートル基準値）。現在は未使用だが、調整用に関数は残置。
const FOG_CLEAR_RADIUS_METERS = 120;

// 指定緯度・ズームでの「メートル→ピクセル」換算（Web Mercatorタイル基準の近似式）
// 現状の呼び出し箇所では使っていないが、メートル基準に戻したい場合のために残す。
function metersToPixels(meters, lat, zoom) {
  const EARTH_CIRCUMFERENCE_M = 40075017;
  const metersPerPixel = EARTH_CIRCUMFERENCE_M * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom + 8);
  return meters / metersPerPixel;
}

// OSM標準スタイル(osm-carto)における林道クラス(track/unclassified等の細道)の
// ズームレベル別おおよその描画幅(px)の目安。タイルから実測はできないため近似値。
// 現在は未使用（晴れ半径はFOG_CLEAR_RADIUS_PX_BY_ZOOMを直接参照する方式に変更）だが、調整用に残置。
const TRACK_ROAD_WIDTH_PX_BY_ZOOM = {
  9: 0.5, 10: 0.5, 11: 0.6, 12: 0.7, 13: 0.8,
  14: 1.0, 15: 1.3, 16: 1.8, 17: 2.5, 18: 3.5, 19: 5.0
};
const FOG_CLEAR_RADIUS_ROAD_WIDTH_MULTIPLIER = 6;
const FOG_CLEAR_RADIUS_MIN_PX = 5;

// ズーム(小数含む)から林道の描画幅(px)を線形補間で求める（現在は未使用、調整用に残置）
function getTrackRoadWidthPx(zoom) {
  const keys = Object.keys(TRACK_ROAD_WIDTH_PX_BY_ZOOM).map(Number);
  const minZ = Math.min(...keys), maxZ = Math.max(...keys);
  const z = Math.max(minZ, Math.min(maxZ, zoom));
  const floor = Math.floor(z), ceil = Math.ceil(z);
  if (floor === ceil) return TRACK_ROAD_WIDTH_PX_BY_ZOOM[floor];
  const t = z - floor;
  return TRACK_ROAD_WIDTH_PX_BY_ZOOM[floor] * (1 - t) + TRACK_ROAD_WIDTH_PX_BY_ZOOM[ceil] * t;
}

// 霧の晴れ半径(px)をズームレベルごとに直接指定するテーブル。
// 広域(8〜13)は目視で確認できる程度に控えめ、拡大するにつれて滑らかに増加し、高ズーム(17〜19)で20〜30px程度になるカーブ。
const FOG_CLEAR_RADIUS_PX_BY_ZOOM = {
  8: 5, 9: 5, 10: 5, 11: 5, 12: 5, 13: 5,
  14: 10, 15: 15, 16: 18, 17: 22, 18: 26, 19: 30
};

// ズーム(小数含む)からFOG_CLEAR_RADIUS_PX_BY_ZOOMを線形補間で求める（getTrackRoadWidthPxと同じロジック）
function getFogClearRadiusFromTable(zoom) {
  const keys = Object.keys(FOG_CLEAR_RADIUS_PX_BY_ZOOM).map(Number);
  const minZ = Math.min(...keys), maxZ = Math.max(...keys);
  const z = Math.max(minZ, Math.min(maxZ, zoom));
  const floor = Math.floor(z), ceil = Math.ceil(z);
  if (floor === ceil) return FOG_CLEAR_RADIUS_PX_BY_ZOOM[floor];
  const t = z - floor;
  return FOG_CLEAR_RADIUS_PX_BY_ZOOM[floor] * (1 - t) + FOG_CLEAR_RADIUS_PX_BY_ZOOM[ceil] * t;
}

// 現在地アイコン(circleMarker radius=8, weight=2)の画面上の実際の直径 ≈ (radius + weight/2) * 2
const CURRENT_LOCATION_ICON_SIZE_PX = (8 + 2 / 2) * 2;

// 霧の晴れ半径(px)方式2：現在地アイコン基準アンカー＋線形減衰。
// z19時点の半径をアイコン実寸の1.2倍とし、ズームが下がるごとに減衰させる。
const ANCHOR_RADIUS_PX = CURRENT_LOCATION_ICON_SIZE_PX * 1.2;
// z19からこのズームで下限(FOG_CLEAR_RADIUS_MIN_PX)に到達するよう減衰幅を逆算
const ANCHOR_DECAY_FLOOR_ZOOM = 12;
const ANCHOR_DECAY_PER_ZOOM = (ANCHOR_RADIUS_PX - FOG_CLEAR_RADIUS_MIN_PX) / (19 - ANCHOR_DECAY_FLOOR_ZOOM);

// ズーム(小数含む)からアイコン基準アンカー方式の晴れ半径を求める（クランプなし、下限適用はgetFogClearRadiusPx側で行う）
function getFogClearRadiusFromIconAnchor(zoom) {
  return ANCHOR_RADIUS_PX - (19 - zoom) * ANCHOR_DECAY_PER_ZOOM;
}

// 霧の晴れ半径(px)。下限FOG_CLEAR_RADIUS_MIN_PXでクランプする。
// 旧テーブル方式に戻す場合はこの1行を getFogClearRadiusFromTable(zoom) に差し替えるだけでOK。
function getFogClearRadiusPx(zoom) {
  return Math.max(FOG_CLEAR_RADIUS_MIN_PX, getFogClearRadiusFromIconAnchor(zoom));
}

// 晴れ半径(px)をその場の緯度・ズームでおおよそのメートルに変換（間引き判定専用）
function fogRadiusPxToMeters(px, lat, zoom) {
  const EARTH_CIRCUMFERENCE_M = 40075017;
  const metersPerPixel = EARTH_CIRCUMFERENCE_M * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom + 8);
  return px * metersPerPixel;
}

// 描画専用の間引き：記録データ(points)自体は変更せず、fogを晴らす対象点だけを間引いた配列を返す。
// 直前に採用した点から実距離でminDistanceMeters未満の点はスキップする。
function decimatePointsForFog(points, minDistanceMeters) {
  if (points.length <= 1 || minDistanceMeters <= 0) return points;
  const kept = [points[0]];
  let last = points[0];
  for (let i = 1; i < points.length; i++) {
    if (map.distance(last, points[i]) >= minDistanceMeters) {
      kept.push(points[i]);
      last = points[i];
    }
  }
  return kept;
}

function toggleFogMode() {
  fogMode = !fogMode;
  const btn = document.getElementById('fog-toggle-btn');
  if (fogMode) {
    fogCanvas.classList.add('show');
    btn.style.borderColor = '#4A9EFF';
    btn.style.color = '#4A9EFF';
    tracks.forEach(t => t.lines.forEach(l => l.setStyle({ opacity: 0 })));
    gpsPolylines.forEach(l => l.setStyle({ opacity: 0 })); /* 記録中ラインも非表示 */
    drawFog();
  } else {
    fogCanvas.classList.remove('show');
    btn.style.borderColor = '';
    btn.style.color = '';
    tracks.forEach(t => {
      const color = DIFF[t.difficulty || 'unset'] ? DIFF[t.difficulty || 'unset'].color : '#888';
      t.lines.forEach(l => l.setStyle({ opacity: 0.9, color }));
    });
    gpsPolylines.forEach(l => l.setStyle({ opacity: 0.9, color: '#E8852A' })); /* 線モード復元 */
  }
  saveSessionState();
}

// ---- 霧レイヤーのバッファ描画（円形カバレッジ方式） ----
// ヘディングアップ(コンパス回転)時、fog-canvasの中身はmap.project()で北基準(回転非対応)に
// 描画されるため、キャンバス自体をCSSで現在のbearing分だけ回転させて画面表示と合わせる必要がある。
// 矩形バッファのままだと回転角度によって「隅」から先に破綻するため、どの向きに回転しても
// 均等に安全な「円形」バッファ（ビューポート対角線の半分を基準にした半径）に変更する。
const FOG_CIRCULAR_SAFETY_MULTIPLIER = 3.0; // 半径 = (対角線/2) × この倍率
const FOG_BUFFER_THRESHOLD_RATIO = 0.7; // 半径のこの割合パンしたら再センタリング（既存のまま維持）
let fogCenterLatLng = null; // 直近フル再描画時の地図中心（バッファキャンバス中心が指す地理座標）
let fogRedrawZoom = null;   // 直近フル再描画時のズーム
let fogPanOffset = null;    // 直近の追従translateオフセット（再センタリング直後はゼロ）

// 現在のパンオフセット(translate)と現在のbearing(rotate)を合成してcanvasに適用する。
// bearingは絶対値をそのまま使う（描画内容は常に北基準なので、現在のbearingで回転させれば画面と一致する）。
function applyFogCanvasTransform() {
  const bearing = (map.getBearing ? map.getBearing() : 0) || 0;
  const p = fogPanOffset || L.point(0, 0);
  fogCanvas.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${bearing}deg)`;
}

function drawFog() {
  if (!fogMode) return;
  const size = map.getSize();
  const diagonal = Math.hypot(size.x, size.y);
  const radius = (diagonal / 2) * FOG_CIRCULAR_SAFETY_MULTIPLIER;
  const canvasSide = Math.round(radius * 2);
  fogCanvas.width = canvasSide;
  fogCanvas.height = canvasSide;
  fogCanvas.style.width = canvasSide + 'px';
  fogCanvas.style.height = canvasSide + 'px';
  fogCanvas.style.left = Math.round((size.x - canvasSide) / 2) + 'px';
  fogCanvas.style.top = Math.round((size.y - canvasSide) / 2) + 'px';
  fogPanOffset = L.point(0, 0); /* 再センタリングするので追従オフセットはリセット（回転は現在値を維持） */
  applyFogCanvasTransform();

  fogCenterLatLng = map.getCenter();
  fogRedrawZoom = map.getZoom();

  fogCtx.fillStyle = 'rgba(50,50,50,0.6)'; /* 変更前: 0.80 */
  fogCtx.fillRect(0, 0, canvasSide, canvasSide);
  fogCtx.globalCompositeOperation = 'destination-out';

  const clearRadius = getFogClearRadiusPx(fogRedrawZoom);

  /* ピンチズーム中はLeafletがzoomanimを介さず毎フレームdrawFog()を直接呼ぶため、
     GPS点ごとにcreateRadialGradientするとコストが積み上がり重くなる。
     半径分の「晴らしブラシ」を1回だけオフスクリーンに描いて使い回す（drawImageは軽い）。 */
  const brushSize = Math.max(1, Math.ceil(clearRadius * 2));
  const brush = document.createElement('canvas');
  brush.width = brushSize;
  brush.height = brushSize;
  const brushCtx = brush.getContext('2d');
  const grad = brushCtx.createRadialGradient(clearRadius, clearRadius, 0, clearRadius, clearRadius, clearRadius);
  grad.addColorStop(0, 'rgba(0,0,0,1)');
  grad.addColorStop(0.6, 'rgba(50,50,50,0.85)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  brushCtx.fillStyle = grad;
  brushCtx.fillRect(0, 0, brushSize, brushSize);

  /* バッファキャンバス基準（fogCenterLatLngからの相対位置）で描画位置を計算する。
     map.latLngToContainerPointは「今のビューポート」基準なので使わず、map.project()
     （公開API）で世界座標系のピクセル位置を求めてから中心点との差分を取る。
     このcanvas自体はCSSのrotate()で見た目を回転させるだけなので、内容は常に北基準のまま。 */
  const centerWorldPt = map.project(fogCenterLatLng, fogRedrawZoom);
  const clearFogAt = ll => {
    const worldPt = map.project(ll, fogRedrawZoom);
    const x = worldPt.x - centerWorldPt.x + canvasSide / 2;
    const y = worldPt.y - centerWorldPt.y + canvasSide / 2;
    fogCtx.drawImage(brush, x - clearRadius, y - clearRadius);
  };

  /* 点密度が晴れ半径より高いと円が重なり過ぎて帯状に潰れるため、描画専用に間引く（記録データ自体は変更しない） */
  const clearRadiusMeters = fogRadiusPxToMeters(clearRadius, fogCenterLatLng.lat, fogRedrawZoom);
  const fogDecimationMinDistance = clearRadiusMeters / 2;

  tracks.forEach(t => t.segments.forEach(seg => decimatePointsForFog(seg, fogDecimationMinDistance).forEach(clearFogAt)));
  gpsSegments.forEach(seg => decimatePointsForFog(seg, fogDecimationMinDistance).forEach(clearFogAt)); /* 記録中のGPSトラックも霧を晴らす */

  fogCtx.globalCompositeOperation = 'source-over';
}

// パン・ズームのたびに呼ばれる軽量ハンドラ。ズームが変わった場合、または円形バッファの
// 半径を超えてパンした場合のみdrawFog()でフル再描画する。それ以外は再描画せずCSS transformで
// キャンバスをずらすだけ（コストほぼゼロ）。円形バッファは回転しても形が変わらないため、
// 判定はX/Y独立ではなくMath.hypot()によるユークリッド距離で行う。
function onMapViewChange() {
  if (!fogMode) return;
  if (fogCenterLatLng === null || map.getZoom() !== fogRedrawZoom) {
    drawFog();
    return;
  }

  const size = map.getSize();
  const diagonal = Math.hypot(size.x, size.y);
  const radius = (diagonal / 2) * FOG_CIRCULAR_SAFETY_MULTIPLIER;

  const centerNowPt = map.latLngToContainerPoint(fogCenterLatLng);
  const panOffset = L.point(centerNowPt.x - size.x / 2, centerNowPt.y - size.y / 2);

  if (Math.hypot(panOffset.x, panOffset.y) > radius * FOG_BUFFER_THRESHOLD_RATIO) {
    drawFog();
  } else {
    fogPanOffset = panOffset;
    applyFogCanvasTransform();
  }
}

map.on('move zoom moveend zoomend', onMapViewChange);
// ウィンドウリサイズ・画面回転でビューポートサイズが変わった場合もバッファがズレるため再センタリング
window.addEventListener('resize', () => { if (fogMode) drawFog(); });

// ---- ヘディングアップ ----
let headingUp = false;
let headingOrientationEventName = null;

function loadHeadingUpPref() {
  return localStorage.getItem('jimny_heading_up') === '1';
}
function saveHeadingUpPref(v) {
  localStorage.setItem('jimny_heading_up', v ? '1' : '0');
}

// iOSはwebkitCompassHeadingで真北基準の値を直接取得できる。
// Androidはalpha(反時計回り)を反転し、画面の向き(screen.orientation.angle)を補正する必要があるが、
// 実機ごとにズレが出ることがあるため実機確認しながら調整すること。
function computeCompassHeading(event) {
  if (typeof event.webkitCompassHeading === 'number') {
    updateHeadingDebug(event, 'webkitCompassHeading', event.webkitCompassHeading);
    return event.webkitCompassHeading;
  }
  if (event.alpha === null || event.alpha === undefined) {
    updateHeadingDebug(event, 'alpha無効(null/undefined)', null);
    return null;
  }
  const screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const heading = (360 - event.alpha + screenAngle + 360) % 360;
  updateHeadingDebug(event, 'alpha補正', heading);
  return heading;
}

// [DEBUG] webkitCompassHeadingが原因かどうかを実機で切り分けるための一時表示。確認後に削除すること。
function updateHeadingDebug(event, branch, heading) {
  const dbg = document.getElementById('heading-debug');
  if (!dbg) return;
  dbg.textContent =
    `webkitCompassHeading: ${event.webkitCompassHeading} (${typeof event.webkitCompassHeading})\n` +
    `alpha: ${event.alpha}\n` +
    `branch: ${branch}\n` +
    `heading: ${heading === null ? 'null' : heading.toFixed(1)}`;
}

function handleOrientationEvent(event) {
  if (!headingUp) return;
  const heading = computeCompassHeading(event);
  if (heading === null) return;
  map.setBearing(heading);
  /* 霧の内容は北基準で描画済みなので、bearingが変わっただけならフル再描画は不要。
     canvasの回転transformを更新するだけで画面表示と一致する。 */
  if (fogMode) applyFogCanvasTransform();
}

function startHeadingUp() {
  headingOrientationEventName = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
  window.addEventListener(headingOrientationEventName, handleOrientationEvent);
  headingUp = true;
  saveHeadingUpPref(true);
  updateHeadingToggleBtn();
  const dbg = document.getElementById('heading-debug');
  if (dbg) dbg.style.display = 'block';
}

function stopHeadingUp() {
  if (headingOrientationEventName) {
    window.removeEventListener(headingOrientationEventName, handleOrientationEvent);
    headingOrientationEventName = null;
  }
  headingUp = false;
  saveHeadingUpPref(false);
  map.setBearing(0);
  if (fogMode) applyFogCanvasTransform();
  updateHeadingToggleBtn();
  const dbg = document.getElementById('heading-debug');
  if (dbg) dbg.style.display = 'none';
}

function updateHeadingToggleBtn() {
  document.getElementById('heading-toggle-btn').classList.toggle('active', headingUp);
}

async function toggleHeadingUp() {
  if (headingUp) { stopHeadingUp(); return; }

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result !== 'granted') {
        alert('コンパスの利用が許可されませんでした');
        return;
      }
    } catch (e) {
      alert('コンパスの利用が許可されませんでした');
      return;
    }
  }
  startHeadingUp();
}

function initHeadingUpRecovery() {
  if (!loadHeadingUpPref()) return;
  // iOSは許可状態がページ再読み込みで引き継がれないため自動再開できない（再タップで再許可が必要）
  const needsIOSPermission = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
  if (!needsIOSPermission) startHeadingUp();
}

function openHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';

  if (tracks.length === 0) {
    list.innerHTML = '<div class="history-empty">走行記録がまだありません</div>';
  } else {
    [...tracks].reverse().forEach((t, revIdx) => {
      const idx = tracks.length - 1 - revIdx;
      const diff = t.difficulty || 'unset';
      const color = DIFF[diff] ? DIFF[diff].color : '#888';
      const label = DIFF[diff] ? DIFF[diff].label : '⬜ 未分類';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-diff" style="background:${color}"></div>
        <div class="history-info">
          <div class="history-date">${t.date || '日付不明'}</div>
          <div class="history-km">${(t.km || 0).toFixed(1)} <span style="font-size:13px;color:#aaa">km</span></div>
          <div class="history-diff-label">${label}</div>
        </div>
        <div class="history-actions">
          <button class="history-btn" onclick="focusTrack(${idx})">📍 表示</button>
          <button class="history-btn danger" onclick="deleteTrack(${idx})">🗑 削除</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  document.getElementById('history-panel').classList.add('open');
}

function focusTrack(idx) {
  const t = tracks[idx];
  const flat = t ? t.segments.flat() : [];
  if (!t || !flat.length) return;
  document.getElementById('history-panel').classList.remove('open');
  map.fitBounds(L.latLngBounds(flat), { padding: [60, 60] });
}

function deleteTrack(idx) {
  const t = tracks[idx];
  if (!t) return;
  if (!confirm('この走行記録を削除しますか？')) return;
  t.lines.forEach(l => map.removeLayer(l));
  totalKm -= t.km || 0;
  tracks.splice(idx, 1);
  saveToStorage();
  updateStats();
  if (fogMode) drawFog();
  openHistory();
}

function toggleLegend() {
  document.getElementById('legend').classList.toggle('show');
}

function setDifficulty(diff) {
  if (selectedTrackIndex === null) return;
  const track = tracks[selectedTrackIndex];
  track.difficulty = diff;
  const color = DIFF[diff].color;
  track.lines.forEach(l => l.setStyle({ color }));
  saveToStorage();
  document.getElementById('diff-modal').classList.remove('open');
  selectedTrackIndex = null;
}

function toggleGPS() {
  gpsWatcher !== null ? stopGPS() : startGPS();
}

function computeSegmentsKm(segments) {
  let km = 0;
  segments.forEach(seg => {
    for (let i = 1; i < seg.length; i++) km += map.distance(seg[i-1], seg[i]);
  });
  return km / 1000;
}

function startGPS(resumeState) {
  if (!navigator.geolocation) { alert('GPSに対応していません'); return; }
  if (!resumeState) {
    gpsSegments = [[]];
    gpsPolylines = [];
    gpsStartTime = Date.now();
    currentSessionId = 's' + gpsStartTime;
  }
  const btn = document.getElementById('gps-btn');
  btn.classList.add('recording');
  document.getElementById('gps-icon').textContent = '⏹';
  document.getElementById('gps-label').textContent = '停止';
  document.getElementById('live-badge').classList.add('show');
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  requestWakeLock();
  saveSessionState();

  gpsWatcher = navigator.geolocation.watchPosition(pos => {
    const latlng = [pos.coords.latitude, pos.coords.longitude];
    let seg = gpsSegments[gpsSegments.length - 1];
    if (pendingGapCheck) {
      pendingGapCheck = false;
      if (seg.length > 0 && map.distance(seg[seg.length - 1], latlng) >= 50) {
        seg = [];
        gpsSegments.push(seg);
      }
    }
    seg.push(latlng);

    if (gpsPolylines.length < gpsSegments.length) {
      const opacity = fogMode ? 0 : 0.9;
      gpsPolylines.push(L.polyline([latlng], { color: '#E8852A', weight: 5, opacity }).addTo(map));
    } else {
      gpsPolylines[gpsPolylines.length - 1].addLatLng(latlng);
    }

    moveCurrentPosition(latlng);
    if (fogMode) drawFog(); /* 霧モード時は位置更新のたびに霧を再描画（実GPS座標ベース） */

    const totalPts = gpsSegments.reduce((n, s) => n + s.length, 0);
    if (totalPts > 1) {
      document.getElementById('live-km').textContent = computeSegmentsKm(gpsSegments).toFixed(1);
    }
    saveSessionState();
    saveActiveTrack();
  }, err => console.warn(err.message), { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 });
}

function stopGPS() {
  navigator.geolocation.clearWatch(gpsWatcher);
  gpsWatcher = null;
  clearInterval(timerInterval);
  releaseWakeLock();
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  displayedLatLng = null;
  const btn = document.getElementById('gps-btn');
  btn.classList.remove('recording');
  document.getElementById('gps-icon').textContent = '📍';
  document.getElementById('gps-label').textContent = '記録開始';
  document.getElementById('gps-timer').style.display = 'none';
  document.getElementById('live-badge').classList.remove('show');
  if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }

  const totalPts = gpsSegments.reduce((n, s) => n + s.length, 0);
  if (totalPts > 1) {
    const km = computeSegmentsKm(gpsSegments);
    totalKm += km;
    const segments = gpsSegments.map(s => [...s]);
    const idx = tracks.length;
    const lines = gpsPolylines;
    lines.forEach(l => {
      l.setStyle({ color: '#888' });
      l.on('click', () => openDiffModal(idx));
    });
    tracks.push({ segments, km, date: new Date().toLocaleDateString('ja-JP'), difficulty: 'unset', lines });
    saveToStorage();
    updateStats();
  } else {
    gpsPolylines.forEach(l => map.removeLayer(l));
  }
  gpsPolylines = [];
  gpsSegments = [[]];
  currentSessionId = null;
  clearActiveTrack();
  saveSessionState();
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - gpsStartTime) / 1000);
  const h = Math.floor(elapsed/3600);
  const m = Math.floor((elapsed%3600)/60);
  const s = elapsed%60;
  const timer = document.getElementById('gps-timer');
  timer.style.display = 'block';
  timer.textContent = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ---- 現在地マーカーの補間アニメーション ----
function moveCurrentPosition(newLatLng) {
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  const from = displayedLatLng;
  if (!from || map.distance(from, newLatLng) > 200) {
    displayedLatLng = newLatLng;
    renderCurrentPosition(newLatLng);
    return;
  }
  const duration = 1000;
  const t0 = performance.now();
  const fromLL = from;
  function step(now) {
    const t = Math.min((now - t0) / duration, 1);
    displayedLatLng = [
      fromLL[0] + (newLatLng[0] - fromLL[0]) * t,
      fromLL[1] + (newLatLng[1] - fromLL[1]) * t,
    ];
    renderCurrentPosition(displayedLatLng);
    animRAF = t < 1 ? requestAnimationFrame(step) : null;
  }
  animRAF = requestAnimationFrame(step);
}

function renderCurrentPosition(latlng) {
  if (currentMarker) currentMarker.setLatLng(latlng);
  else currentMarker = L.circleMarker(latlng, { radius: 8, color: '#fff', fillColor: '#4A9EFF', fillOpacity: 1, weight: 2 }).addTo(map);
  map.setView(latlng, map.getZoom(), { animate: false });
}

// ---- Wake Lock ----
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { console.log('WakeLock取得失敗', e); }
}

function releaseWakeLock() {
  try {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) { console.log('WakeLock解放失敗', e); }
}

// ---- セッション状態の永続化（復帰用） ----
function saveSessionState() {
  try {
    localStorage.setItem('jimny_session_state', JSON.stringify({
      recording: gpsWatcher !== null,
      fogMode,
      sessionId: currentSessionId,
      gpsStartTime,
    }));
  } catch (e) { console.log('セッション状態の保存失敗', e); }
}

function loadSessionState() {
  try {
    return JSON.parse(localStorage.getItem('jimny_session_state') || 'null');
  } catch (e) { return null; }
}

function clearSessionState() {
  localStorage.removeItem('jimny_session_state');
}

function saveActiveTrack() {
  try {
    localStorage.setItem('jimny_active_track', JSON.stringify({
      sessionId: currentSessionId,
      segments: gpsSegments,
    }));
  } catch (e) { console.log('記録中データの保存失敗', e); }
}

function loadActiveTrack() {
  try {
    return JSON.parse(localStorage.getItem('jimny_active_track') || 'null');
  } catch (e) { return null; }
}

function clearActiveTrack() {
  localStorage.removeItem('jimny_active_track');
}

// ---- 復帰処理 ----
function restoreFogIfNeeded(state) {
  if (!state || !state.fogMode) return;
  fogMode = true;
  const btn = document.getElementById('fog-toggle-btn');
  fogCanvas.classList.add('show');
  btn.style.borderColor = '#4A9EFF';
  btn.style.color = '#4A9EFF';
  tracks.forEach(t => t.lines.forEach(l => l.setStyle({ opacity: 0 })));
  gpsPolylines.forEach(l => l.setStyle({ opacity: 0 }));
  drawFog();
}

function initSessionRecovery() {
  const state = loadSessionState();
  if (state && state.recording) {
    if (confirm('前回の記録が中断されています。再開しますか？')) {
      const active = loadActiveTrack();
      if (active && active.sessionId === state.sessionId && active.segments && active.segments.length) {
        gpsSegments = active.segments;
        gpsStartTime = state.gpsStartTime || Date.now();
        currentSessionId = state.sessionId;
        gpsSegments.forEach(seg => {
          if (seg.length) {
            const opacity = state.fogMode ? 0 : 0.9;
            gpsPolylines.push(L.polyline(seg, { color: '#E8852A', weight: 5, opacity }).addTo(map));
          }
        });
        const lastSeg = gpsSegments[gpsSegments.length - 1];
        if (lastSeg.length) {
          displayedLatLng = lastSeg[lastSeg.length - 1];
          renderCurrentPosition(displayedLatLng);
        }
      } else {
        gpsSegments = [[]];
        gpsStartTime = state.gpsStartTime || Date.now();
        currentSessionId = state.sessionId || ('s' + Date.now());
      }
      pendingGapCheck = true;
      restoreFogIfNeeded(state);
      startGPS(true);
    } else {
      clearSessionState();
      clearActiveTrack();
    }
  } else {
    restoreFogIfNeeded(state);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const s = loadSessionState();
    if (!s) return;
    if (s.recording) {
      requestWakeLock();
      if (gpsWatcher === null) {
        pendingGapCheck = true;
        startGPS(true);
      }
    }
    if (s.fogMode && !fogMode) restoreFogIfNeeded(s);
    else if (fogMode) drawFog();
  });
}

// ---- GPX ----
function loadGPX(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const xml = new DOMParser().parseFromString(e.target.result, 'text/xml');
    const trkpts = xml.querySelectorAll('trkpt');
    if (!trkpts.length) { alert('トラックポイントが見つかりません'); return; }
    const latlngs = Array.from(trkpts).map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))]);
    let km = 0;
    for (let i = 1; i < latlngs.length; i++) km += map.distance(latlngs[i-1], latlngs[i]);
    totalKm += km/1000;
    const line = L.polyline(latlngs, { color: '#888', weight: 5, opacity: 0.9 }).addTo(map);
    const idx = tracks.length;
    line.on('click', () => openDiffModal(idx));
    tracks.push({ segments: [latlngs], km: km/1000, date: file.name, difficulty: 'unset', lines: [line] });
    map.fitBounds(line.getBounds(), { padding: [60,60] });
    saveToStorage(); updateStats();
    input.value = '';
    document.getElementById('gpx-modal').classList.remove('open');
  };
  reader.readAsText(file);
}

// ---- ピン ----
let pinMode = false;
let pendingLatLng = null;
let selectedCat = 'road_closed';

function selectCat(el) {
  document.querySelectorAll('.pin-cat').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedCat = el.dataset.cat;
  document.getElementById('pin-url-wrap').style.display = selectedCat === 'video' ? 'flex' : 'none';
  if (selectedCat === 'video') document.getElementById('pin-url-wrap').style.flexDirection = 'column';
}

function startPinMode() {
  if (pinMode) return;
  pinMode = true;
  map.getContainer().style.cursor = 'crosshair';
  alert('情報を追加したい場所をタップしてください');
  map.once('click', e => {
    pendingLatLng = e.latlng;
    map.getContainer().style.cursor = '';
    document.getElementById('pin-modal').classList.add('open');
  });
}

function cancelPin() {
  pinMode = false;
  pendingLatLng = null;
  selectedPhotoData = null;
  map.getContainer().style.cursor = '';
  document.getElementById('pin-modal').classList.remove('open');
  document.getElementById('pin-name').value = '';
  document.getElementById('pin-note').value = '';
  document.getElementById('pin-url').value = '';
  document.getElementById('photo-preview').classList.remove('show');
  document.getElementById('photo-drop').style.display = 'block';
}

function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    compressPhoto(e.target.result, compressed => {
      selectedPhotoData = compressed;
      const preview = document.getElementById('photo-preview');
      preview.src = compressed;
      preview.classList.add('show');
      document.getElementById('photo-drop').style.display = 'none';
    });
  };
  reader.readAsDataURL(file);
}

function compressPhoto(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const MAX = 800;
    let w = img.width, h = img.height;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else { w = Math.round(w * MAX / h); h = MAX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.src = dataUrl;
}

function confirmPin() {
  const name = document.getElementById('pin-name').value.trim() || CAT[selectedCat].label;
  const note = document.getElementById('pin-note').value.trim();
  const url = selectedCat === 'video' ? document.getElementById('pin-url').value.trim() : '';
  const orient = document.getElementById('pin-orient').value;
  if (selectedCat === 'video' && !url) { alert('動画URLを入力してください'); return; }

  const pinData = {
    latlng: pendingLatLng,
    cat: selectedCat,
    name,
    note,
    url,
    embedUrl: url ? toEmbedUrl(url) : '',
    orient,
    photo: selectedPhotoData,
    date: new Date().toLocaleDateString('ja-JP')
  };

  if (editingPinIndex !== null) {
    const old = pins[editingPinIndex];
    if (old.marker) map.removeLayer(old.marker);
    pinData.latlng = old.latlng;
    addPinToMap(pinData);
    pins[editingPinIndex] = pinData;
    editingPinIndex = null;
  } else {
    addPinToMap(pinData);
    pins.push(pinData);
  }
  saveToStorage();
  updateStats();
  cancelPin();
}

function addPinToMap(p) {
  const c = CAT[p.cat];
  const icon = L.divIcon({
    className: '',
    html: `<div style="font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));cursor:pointer;line-height:1;">${c.icon}</div>`,
    iconAnchor: [12, 24]
  });
  const marker = L.marker(p.latlng, { icon }).addTo(map);
  marker.on('click', () => openPinDetail(p));
  p.marker = marker;
}

function openPinDetail(p) {
  const c = CAT[p.cat];
  document.getElementById('pd-cat-icon').textContent = c.icon;
  document.getElementById('pd-title').textContent = p.name;

  let body = `<b style="color:#888;font-size:11px">${c.label}　${p.date}</b>`;
  if (p.note) body += `<br><br>${p.note}`;
  document.getElementById('pd-body').innerHTML = body;

  const photo = document.getElementById('pd-photo');
  if (p.photo) { photo.src = p.photo; photo.classList.add('show'); }
  else photo.classList.remove('show');

  currentPinData = p;
  const vBtn = document.getElementById('pd-video-btn');
  if (p.cat === 'video' && p.embedUrl) vBtn.classList.add('show');
  else vBtn.classList.remove('show');

  document.getElementById('pin-detail').classList.add('open');
}

function closePinDetail() {
  document.getElementById('pin-detail').classList.remove('open');
  currentPinData = null;
}

let editingPinIndex = null;

function editCurrentPin() {
  if (!currentPinData) return;
  editingPinIndex = pins.indexOf(currentPinData);
  closePinDetail();

  const p = currentPinData;
  document.getElementById('pin-name').value = p.name || '';
  document.getElementById('pin-note').value = p.note || '';
  document.getElementById('pin-url').value = p.url || '';
  document.getElementById('pin-orient').value = p.orient || 'h';

  document.querySelectorAll('.pin-cat').forEach(c => {
    c.classList.toggle('selected', c.dataset.cat === p.cat);
  });
  selectedCat = p.cat;
  document.getElementById('pin-url-wrap').style.display = selectedCat === 'video' ? 'flex' : 'none';
  if (selectedCat === 'video') document.getElementById('pin-url-wrap').style.flexDirection = 'column';

  if (p.photo) {
    const preview = document.getElementById('photo-preview');
    preview.src = p.photo;
    preview.classList.add('show');
    document.getElementById('photo-drop').style.display = 'none';
    selectedPhotoData = p.photo;
  }

  document.getElementById('pin-modal').classList.add('open');
}

function deleteCurrentPin() {
  if (!currentPinData) return;
  if (!confirm(`「${currentPinData.name}」を削除しますか？`)) return;
  const idx = pins.indexOf(currentPinData);
  if (idx !== -1) {
    if (currentPinData.marker) map.removeLayer(currentPinData.marker);
    pins.splice(idx, 1);
    saveToStorage();
    updateStats();
  }
  closePinDetail();
}

function playPinVideo() {
  if (!currentPinData) return;
  closePinDetail();
  openVideoPanel(currentPinData.name, currentPinData.embedUrl, currentPinData.orient);
}

function openDiffModal(idx) {
  selectedTrackIndex = idx;
  document.getElementById('diff-modal').classList.add('open');
}

function openVideoPanel(name, embedUrl, orient) {
  document.getElementById('vp-title').textContent = name;
  const embed = document.getElementById('video-embed');
  embed.src = embedUrl;
  embed.className = orient === 'v' ? 'vertical' : '';
  document.getElementById('video-panel').classList.add('open');
}

function closeVideoPanel() {
  document.getElementById('video-panel').classList.remove('open');
  document.getElementById('video-embed').src = '';
}

function toEmbedUrl(url) {
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  if (url.includes('instagram.com')) return url.split('?')[0].replace(/\/$/, '') + '/embed';
  return url;
}

function clearAll() {
  if (!confirm('全ての走行記録とピンを削除しますか？')) return;
  tracks.forEach(t => t.lines.forEach(l => map.removeLayer(l)));
  pins.forEach(p => { if (p.marker) map.removeLayer(p.marker); });
  tracks = []; pins = []; totalKm = 0;
  localStorage.removeItem('jimny-tracks');
  localStorage.removeItem('jimny-pins');
  updateStats();
}

function updateStats() {
  document.getElementById('stat-km').textContent = Math.round(totalKm);
  document.getElementById('stat-pins').textContent = pins.length;
}

// ---- ストレージ ----
function saveToStorage() {
  try {
    localStorage.setItem('jimny-tracks', JSON.stringify(
      tracks.map(t => ({ segments: t.segments, km: t.km, date: t.date, difficulty: t.difficulty || 'unset' }))
    ));
    localStorage.setItem('jimny-pins', JSON.stringify(
      pins.map(p => ({ latlng: p.latlng, cat: p.cat, name: p.name, note: p.note, url: p.url, embedUrl: p.embedUrl, orient: p.orient, photo: p.photo, date: p.date }))
    ));
  } catch(e) { console.warn('保存失敗（容量超過の可能性）', e); }
}

function loadFromStorage() {
  try {
    const savedTracks = JSON.parse(localStorage.getItem('jimny-tracks') || '[]');
    savedTracks.forEach(t => {
      const diff = t.difficulty || 'unset';
      const color = DIFF[diff] ? DIFF[diff].color : '#888';
      const segments = t.segments || [t.latlngs || []]; /* 旧形式（単一latlngs）との後方互換 */
      const idx = tracks.length;
      const lines = segments.map(seg => {
        const line = L.polyline(seg, { color, weight: 5, opacity: 0.9 }).addTo(map);
        line.on('click', () => openDiffModal(idx));
        return line;
      });
      tracks.push({ segments, km: t.km, date: t.date, difficulty: diff, lines });
      totalKm += t.km || 0;
    });
    const savedPins = JSON.parse(localStorage.getItem('jimny-pins') || '[]');
    savedPins.forEach(p => { addPinToMap(p); pins.push(p); });
    updateStats();
    if (tracks.length > 0) {
      const bounds = L.latLngBounds(tracks.flatMap(t => t.segments.flat()));
      map.fitBounds(bounds, { padding: [60,60] });
    }
  } catch(e) {}
}

loadFromStorage();
initSessionRecovery();
initHeadingUpRecovery();
</script>
